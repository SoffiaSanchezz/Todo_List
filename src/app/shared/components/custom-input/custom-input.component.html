<ion-item>
  <ion-label position="floating">{{ label }}</ion-label>
  <ion-input [type]="showPasswordToggle && !passwordVisible ? 'password' : type" [placeholder]="placeholder"
    [value]="value" [disabled]="isDisabled" (ionInput)="onInputChange($event)" (ionBlur)="onTouched()"></ion-input>
  <ion-icon *ngIf="showPasswordToggle" slot="end" [name]="passwordVisible ? 'eye-off' : 'eye'"
    (click)="togglePasswordVisibility()"></ion-icon>
</ion-item>
<ion-note *ngIf="ngControl?.control?.touched" color="danger">
  <ng-container *ngFor="let errorKey of getErrorKeys()">
    <p *ngIf="hasError(errorKey)">
      {{ errorMessages[errorKey] }}
    </p>
  </ng-container>
</ion-note>
