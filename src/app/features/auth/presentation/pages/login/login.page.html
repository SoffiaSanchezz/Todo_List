<app-header></app-header>

<ion-content class="login-content">
  <!-- Fondo decorativo con luces difusas -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="title">Bienvenido de nuevo</h1>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>
      </div>

      <form class="form" [formGroup]="loginForm" (ngSubmit)="login()">
        
        <!-- Campo: Email -->
        <div class="input-group" [class.has-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input type="email" id="email" formControlName="email" placeholder="nombre@ejemplo.com">
          </div>
          <div class="error-container" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <p *ngIf="loginForm.get('email')?.errors?.['required']">El correo es obligatorio</p>
            <p *ngIf="loginForm.get('email')?.errors?.['email']">Formato de correo inválido</p>
          </div>
        </div>

        <!-- Campo: Contraseña -->
        <div class="input-group" [class.has-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <div class="label-row">
            <label for="password">Contraseña</label>
            <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input [type]="passwordVisible ? 'text' : 'password'" id="password" formControlName="password" placeholder="Tu contraseña">
            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
              <ion-icon [name]="passwordVisible ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
          <div class="error-container" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <p *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es obligatoria</p>
            <p *ngIf="loginForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres</p>
          </div>
        </div>

        <!-- Botón de Acción -->
        <button class="btn-primary" type="submit" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">Iniciar Sesión</span>
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <ion-icon *ngIf="!isLoading" name="arrow-forward-outline" class="btn-icon"></ion-icon>
        </button>

        <!-- Mensaje de Error General -->
        <div class="general-error" *ngIf="errorMessage">
          <ion-icon name="alert-circle"></ion-icon>
          <p>{{ errorMessage }}</p>
        </div>
      </form>

      <!-- Divisor Social -->
      <div class="social-divider">
        <span>O continúa con</span>
      </div>

      <!-- Botón Google -->
      <div class="social-actions">
        <button type="button" class="btn-social" (click)="loginWithGoogle()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 512">
            <path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"/>
          </svg>
          Google
        </button>
      </div>
    </div>
  </div>
</ion-content>
