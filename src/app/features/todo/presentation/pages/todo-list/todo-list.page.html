<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Kanban de Tareas</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openCreateCategoryModal()">
        <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
      </ion-button>
      <ion-button routerLink="/auth/login">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [(ngModel)]="filteredCategoryId" (ionChange)="filterTasks($event)">
      <ion-segment-button value="all">
        <ion-label>Todas las Tareas</ion-label>
      </ion-segment-button>
      <ion-segment-button *ngFor="let category of categories" [value]="category.id">
        <ion-label>{{ category.name }}</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="kanban-board">
    <div class="kanban-column" *ngFor="let column of columns">
      <ion-card class="column-header">
        <ion-card-header>
          <ion-card-title>{{ column.title }}</ion-card-title>
          <ion-card-subtitle>({{ column.tasks.length }})</ion-card-subtitle>
        </ion-card-header>
        <!-- Made Add Task button more discrete with smaller icon -->
        <ion-button expand="block" fill="clear" (click)="openCreateTaskModal(column.status)" class="add-task-btn">
          <ion-icon name="add-circle-outline" class="small-icon"></ion-icon> Añadir Tarea
        </ion-button>
      </ion-card>

      <!-- Added wrapper for centered task content -->
      <div class="task-list">
        <app-task-card *ngFor="let task of column.tasks" [task]="task" [categories]="categories"
          (editTask)="openEditTaskModal($event)" (deleteTask)="onTaskDeleted($event)"
          (changeStatus)="onTaskStatusChanged($event)" (markCompleted)="onTaskMarkedCompleted($event)"></app-task-card>
      </div>
    </div>
  </div>
</ion-content>
