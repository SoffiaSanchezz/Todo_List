<ion-header class="ion-no-border kanban-header">
  <ion-toolbar>
    <ion-title>
      <div class="logo-area">
        <ion-icon name="grid-outline" class="title-icon"></ion-icon>
        <span>Board</span>
      </div>
    </ion-title>
    
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="openCreateCategoryModal()" class="header-btn">
        <ion-icon name="folder-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" (click)="openCategoryMenu()" class="header-btn">
        <ion-icon name="options-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" (click)="logout()" class="logout-btn">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <!-- Filtro de Categorías Estilizado -->
  <ion-toolbar class="filter-toolbar">
    <div class="filter-wrapper">
      <ion-segment [(ngModel)]="filteredCategoryId" (ionChange)="filterTasks($event)" mode="md">
        <ion-segment-button value="all">
          <ion-label>All Tasks</ion-label>
        </ion-segment-button>
        <ion-segment-button *ngFor="let category of categories" [value]="category.id">
          <ion-label>{{ category.name }}</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="kanban-content">
  <!-- Fondo decorativo suave -->
  <div class="kanban-background"></div>

  <div class="kanban-board">
    <div class="kanban-column" *ngFor="let column of columns">
      <div class="column-header">
        <div class="header-main">
          <h2 class="column-title">{{ column.title }}</h2>
          <span class="count-badge">{{ column.tasks.length }}</span>
        </div>
        <ion-button fill="clear" (click)="openCreateTaskModal(column.status)" class="btn-add">
          <ion-icon name="add-outline"></ion-icon>
        </ion-button>
      </div>

      <div class="task-list">
        <div *ngIf="column.tasks.length === 0" class="empty-column">
          <ion-icon name="calendar-clear-outline"></ion-icon>
          <p>No tasks yet</p>
        </div>
        
        <app-task-card *ngFor="let task of column.tasks" [task]="task" [categories]="categories"
          (editTask)="openEditTaskModal($event)" (deleteTask)="onTaskDeleted($event)"
          (changeStatus)="onTaskStatusChanged($event)" (markCompleted)="onTaskMarkedCompleted($event)"
          (editCategory)="openEditCategoryModal($event)"></app-task-card>
      </div>
    </div>
  </div>
</ion-content>
