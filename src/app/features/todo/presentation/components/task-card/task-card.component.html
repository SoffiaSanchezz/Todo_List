<div class="task-card-container" [class.is-completed]="task.completed" [class.status-new]="task.status === 'NEW'" [class.status-progress]="task.status === 'IN_PROGRESS'" [class.status-scheduled]="task.status === 'SCHEDULED'">
  
  <div class="card-glow"></div>
  
  <div class="card-main">
    <!-- Checkbox Lateral Estilizado -->
    <div class="check-area">
      <ion-checkbox [checked]="task.completed" (ionChange)="onToggleCompleted()" (click)="stopEventPropagation($event)"></ion-checkbox>
    </div>

    <!-- Contenido de la Tarea -->
    <div class="content-area" (click)="onEditClick()">
      <div class="header-row">
        <span class="status-badge">{{ task.status | titlecase }}</span>
        <span class="time-stamp">{{ task.updatedAt | date:'shortTime' }}</span>
      </div>
      
      <h3 class="task-title">{{ task.title }}</h3>
      <p class="task-desc" *ngIf="task.description">{{ task.description }}</p>
      
      <div class="footer-row">
        <app-category-chip [category]="getCategoryForTask()" (editCategory)="onEditCategoryClick()">
        </app-category-chip>
      </div>
    </div>

    <!-- Acciones Rápidas -->
    <div class="actions-area" (click)="stopEventPropagation($event)">
      <ion-button fill="clear" (click)="onEditClick()" class="btn-edit">
        <ion-icon name="create-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" (click)="onDeleteClick()" color="danger" class="btn-delete">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </div>
  </div>
</div>
