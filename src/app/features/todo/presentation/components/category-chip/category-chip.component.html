<!-- Chip de categoría -->
<!-- Se muestra solo si existe la categoría -->
<ion-chip *ngIf="category" [style.--background]="category.color" [style.color]="textColor">

  <!-- Nombre de la categoría -->
  <ion-label [style.color]="textColor">{{ category.name }}</ion-label>

  <!-- Icono para editar la categoría -->
  <ion-icon name="create-outline" (click)="onEditCategory()" [style.color]="textColor">
  </ion-icon>
</ion-chip>
